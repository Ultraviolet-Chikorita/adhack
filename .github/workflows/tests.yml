name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.sponsor.txt
      - name: Test
        run: python -m pytest -q

  skybridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skybridge__app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: skybridge__app/package-lock.json
      - name: Install
        # The checked-in lockfile predates the current package graph. Use npm
        # install for CI until the lockfile is intentionally regenerated.
        run: npm install --no-audit --no-fund
      - name: Build and generate Skybridge view types
        run: npm run build
      - name: Typecheck generated application surface
        run: npm run typecheck
